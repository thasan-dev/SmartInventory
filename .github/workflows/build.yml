name: Build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SmartInventory.sln

      - name: Build
        run: dotnet build SmartInventory.sln --no-restore --configuration Release

      # TODO: Add test step once test projects are added
      # - name: Test
      #   run: dotnet test SmartInventory.sln --no-build --configuration Release
